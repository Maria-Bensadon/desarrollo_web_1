<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Hotel Terracota</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header>
    <h1>Hotel Terracota</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="institucional.html">Institucional</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="acceso.html">Acceso</a></li>
        <li><a href="registro.html">Registro</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h2>Registro</h2>
    <form action="#" method="post">
      <p><label for="nombre">Nombre</label> <input type="text" id="nombre" name="nombre"></p>
      <p><label for="apellido">Apellido</label> <input type="text" id="apellido" name="apellido"></p>
      <p><label for="dni">DNI</label> <input type="text" id="dni" name="dni"></p>
      <p><label for="email">Email</label> <input type="email" id="email" name="email"></p>
      <p><label for="telefono">Teléfono</label> <input type="tel" id="telefono" name="telefono"></p>
      <p><label for="password">Contraseña</label> <input type="password" id="password" name="password"></p>
      <p><label for="password2">Repetir contraseña</label> <input type="password" id="password2" name="password2"></p>
      <button type="submit">Registrarme</button>
    </form>
    <p>¿Ya tenés cuenta? <a href="acceso.html">Iniciá sesión</a></p>
  </main>
  <footer>
    <p>Hotel Terracota - ApartHotel | San Fernando del Valle de Catamarca</p>
  </footer>
</body>
</html>
