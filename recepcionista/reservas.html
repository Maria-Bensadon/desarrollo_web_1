<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Gestión de reservas | Hotel Terracota</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <header>
    <h1>Hotel Terracota</h1>
    <nav>
      <ul>
        <li><a href="reservas.html">Reservas</a></li>
        <li><a href="estadias.html">Estadías</a></li>
        <li><a href="apartamentos.html">Apartamentos</a></li>

      </ul>
    </nav>
  </header>
  <main>
    <h2>Gestión de reservas</h2>
    <form action="#" method="post">
      <p><label for="desde">Desde</label> <input type="date" id="desde" name="desde"></p>
      <p><label for="hasta">Hasta</label> <input type="date" id="hasta" name="hasta"></p>
      <p><label for="tipo">Tipo</label> <select id="tipo" name="tipo"><option>Todos</option><option>Individual</option><option>Doble</option><option>Familiar</option></select></p>
      <button type="submit">Buscar</button>
    </form>
    <table border="1">
      <thead><tr><th>N° reserva</th><th>Huésped</th><th>Apartamento</th><th>Ingreso</th><th>Egreso</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody><tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr></tbody>
    </table>
    <p>Acciones: consultar / realizar / cancelar reserva.</p>
  </main>
  <footer>
    <p>Hotel Terracota - ApartHotel | San Fernando del Valle de Catamarca</p>
  </footer>
