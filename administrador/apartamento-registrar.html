<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar apartamento | Hotel Terracota</title>
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
  <header>
    <h1>Hotel Terracota</h1>
    <nav>
      <ul>
        <li><a href="usuarios.html">Usuarios</a></li>
        <li><a href="apartamentos.html">Apartamentos</a></li>
        <li><a href="apartamento-registrar.html">Registrar</a></li>
        <li><a href="reservas.html">Reservas</a></li>
        <li><a href="monitoreo.html">Monitoreo</a></li>
        <li><a href="../index.html">Cerrar sesión</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h2>Registrar apartamento</h2>
    <form action="#" method="post">
      <p><label for="nombre">Nombre / N°</label> <input type="text" id="nombre" name="nombre"></p>
      <p><label for="tipo">Tipo</label> <select id="tipo" name="tipo"><option>Individual</option><option>Doble</option><option>Familiar</option></select></p>
      <p><label for="capacidad">Capacidad</label> <input type="number" id="capacidad" name="capacidad"></p>
      <p><label for="tarifa">Tarifa por noche</label> <input type="number" id="tarifa" name="tarifa"></p>
      <p><label for="descripcion">Características y comodidades</label><br><textarea id="descripcion" name="descripcion" rows="4"></textarea></p>
      <p><label for="fotos">Fotos</label> <input type="file" id="fotos" name="fotos"></p>
      <button type="submit">Registrar</button>
    </form>
  </main>
  <footer>
    <p>Hotel Terracota - ApartHotel | San Fernando del Valle de Catamarca</p>
  </footer>
</body>
</html>
